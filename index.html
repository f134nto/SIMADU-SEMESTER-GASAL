        const getScheduleForClass = (className) => {
            const raw = RAW_CLASS_SCHEDULES[className];
            if (!raw) return null; 
            
            const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            
            return days.map(day => {
                const slots = TIME_SLOTS[day];
                let mapelIndex = 0;
                
                const rows = slots.map(slot => {
                    if (['Break', 'MBG', 'Dhuhur', 'Pembiasaan', 'Literasi', 'Upc'].includes(slot.jam)) {
                        return { ...slot, mapel: '', guru: '' };
                    }
                    if (raw[day] && mapelIndex < raw[day].length) {
                        const [mapel, guru] = raw[day][mapelIndex].split('|');
                        mapelIndex++;
                        return { ...slot, mapel, guru };
                    }
                    return { ...slot, mapel: '-', guru: '-' };
                });
                return { day, rows };
            });
        };

        const getScheduleForTeacher = (teacherName) => {
            const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            
            const emptySchedule = days.map(day => ({
                day,
                rows: TIME_SLOTS[day].map(slot => ({ ...slot, kelas: '-', mapel: '-' }))
            }));

            if (!teacherName) return emptySchedule;
            
            const cleanName = (name) => {
                if (!name) return '';
                return name.split(',')[0].toLowerCase().replace(/[^a-z]/g, '');
            };
            
            const targetClean = cleanName(teacherName);

            return days.map(day => {
                const slots = TIME_SLOTS[day];
                let mapelIndexCounter = 0;
                
                const teacherDayRows = slots.map((slot) => {
                    if (['Break', 'MBG', 'Dhuhur', 'Pembiasaan', 'Literasi', 'Upc'].includes(slot.jam)) {
                        return { ...slot, kelas: '', mapel: '' };
                    }
                    
                    let foundKelas = '';
                    let foundMapel = '';
                    
                    Object.keys(RAW_CLASS_SCHEDULES).forEach(cls => {
                        const rawDay = RAW_CLASS_SCHEDULES[cls][day];
                        if (rawDay && mapelIndexCounter < rawDay.length) {
                            const cellData = rawDay[mapelIndexCounter];
                            if (cellData) {
                                const [mapel, guru] = cellData.split('|');
                                // Pengecekan dinamis nama guru dengan ejaan bebas dan tanpa gelar
                                if (guru && (cleanName(guru) === targetClean || cleanName(guru).includes(targetClean) || targetClean.includes(cleanName(guru)))) {
                                    foundKelas = cls;
                                    foundMapel = mapel;
                                }
                            }
                        }
                    });
                    
                    mapelIndexCounter++; 
                    
                    return { ...slot, kelas: foundKelas || '-', mapel: foundMapel || '-' };
                });
                
                return { day, rows: teacherDayRows };
            });
        };

              const parseG = (v) => (v !== undefined && v !== '' ? parseFloat(v) : null);
              
              const s1 = parseG(data.s1);
              const s2 = parseG(data.s2);
              const s3 = parseG(data.s3);
              const s4 = parseG(data.s4);
              const s5 = parseG(data.s5);
              const asts = parseG(data.asts);
              
              const components = [s1, s2, s3, s4, s5, asts];
              const validComponents = components.filter(c => c !== null);
              
              const jml = validComponents.reduce((a, b) => a + b, 0);
              const rata2 = validComponents.length > 0 ? (jml / validComponents.length) : 0;
              const p80 = rata2 * 0.8;
              
              const asas = parseG(data.asas) || 0;
              const p20 = parseG(data.asas) !== null ? asas * 0.2 : 0;
              
              const na = p80 + p20;
              
              return { jml, rata2, p80, p20, na, asas: parseG(data.asas) };

                                    w.name.toLowerCase().includes(searchWaliQuery.toLowerCase()) || 
                                    w.class.toLowerCase().includes(searchWaliQuery.toLowerCase()) ||
                                    w.nip.toLowerCase().includes(searchWaliQuery.toLowerCase())
                                ).map((wali, idx) => (
                                    <tr key={wali.id} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                        <td className="py-3 px-4 text-center font-semibold text-slate-500">{wali.id}</td>
                                        <td className="py-3 px-4 font-bold text-slate-800">{wali.name}</td>
                                        <td className="py-3 px-4 text-center">
                                            <span className="inline-block px-3 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded-lg text-xs font-bold shadow-sm">
                                                {wali.class}
                                            </span>
                                        </td>
                                        <td className="py-3 px-4 text-slate-600 font-mono text-xs">
                                            {wali.nip}
                                        </td>
                                    </tr>
                                ))}
                                {WALI_KELAS_DATA.filter(w => 
                                    w.name.toLowerCase().includes(searchWaliQuery.toLowerCase()) || 
                                    w.class.toLowerCase().includes(searchWaliQuery.toLowerCase()) ||
                                    w.nip.toLowerCase().includes(searchWaliQuery.toLowerCase())
                                ).length === 0 && (
                                    <tr>
                                        <td colSpan="4" className="py-8 text-center text-slate-500 font-medium">Data Wali Kelas tidak ditemukan.</td>
                                    </tr>
                                )}
                            </tbody>
                        </table>
                      </div>
                      <div className="bg-slate-50 p-3 border-t border-slate-200 text-xs text-slate-500 font-semibold text-center">
                          Total: {WALI_KELAS_DATA.length} Wali Kelas
                      </div>
                    </div>
                  </div>
                )}

                {/* TAB: JURNAL MENGAJAR */}
                {activeTab === 'jurnal' && (
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col relative z-0">
                    <div className="overflow-x-auto custom-scrollbar" style={{ maxHeight: '65vh' }}>
                      <table className="w-full text-xs text-left border-collapse min-w-max relative z-0">
                        <thead className="sticky top-0 z-30 shadow-sm">
                          <tr>
                            <th className="py-3 px-4 font-bold border-b border-r border-[#6c8e8c] sticky left-0 bg-[#7DA3A1] text-slate-900 z-30 min-w-[170px] md:min-w-[220px] max-w-[170px] md:max-w-[220px] shadow-[4px_0_10px_-2px_rgba(0,0,0,0.1)] uppercase tracking-wider text-[10px]">No. & Nama Siswa</th>
                            <th className="py-3 px-4 font-bold border-b border-r border-slate-200 md:sticky md:left-[220px] bg-slate-100 text-slate-700 z-20 min-w-[200px] md:min-w-[280px] max-w-[200px] md:max-w-[280px] md:shadow-[4px_0_10px_-2px_rgba(0,0,0,0.05)] uppercase tracking-wider text-[10px]">Materi Pokok Bahasan</th>
                            {daysInMonth.map(day => (
                              <th key={day} className="py-3 px-1 text-center font-bold border-b border-r border-slate-200 bg-slate-50 text-slate-500 w-12 min-w-[48px]">{day}</th>
                            ))}
                            <th className="py-3 px-1.5 text-center font-bold border-b border-slate-200 bg-emerald-50 text-emerald-700 w-10 min-w-[40px]">H</th>
                            <th className="py-3 px-1.5 text-center font-bold border-b border-slate-200 bg-blue-50 text-blue-700 w-10 min-w-[40px]">I</th>
                            <th className="py-3 px-1.5 text-center font-bold border-b border-slate-200 bg-amber-50 text-amber-700 w-10 min-w-[40px]">S</th>
                            <th className="py-3 px-1.5 text-center font-bold border-b border-slate-200 bg-red-50 text-red-700 w-10 min-w-[40px]">A</th>
                          </tr>
                        </thead>
                        <tbody>
                          {currentStudents.map((student, idx) => {
                            const rekap = getRekap(student, activeMonth, true); 
                            const safeRowId = `row-${sanitizeId(student)}`;
                            return (
                              <tr id={safeRowId} key={idx + student} className="hover:bg-slate-50/50 group border-b border-slate-100 last:border-b-0 transition-colors duration-300">
                                <td 
                                  className="py-2 px-4 font-bold text-slate-900 border-r border-[#6c8e8c] sticky left-0 bg-[#7DA3A1] group-hover:bg-[#6c8e8c] z-20 min-w-[170px] md:min-w-[220px] max-w-[170px] md:max-w-[220px] truncate shadow-[4px_0_10px_-2px_rgba(0,0,0,0.08)] transition-colors" 
                                  title={student}
                                >
                                  <span className="text-slate-800 font-semibold inline-block w-4 mr-1 text-right">{idx + 1}.</span> {student}
                                </td>
                                
                                {idx === 0 && (
                                  <td rowSpan={currentStudents.length} className="p-0 border-r border-slate-100 md:sticky md:left-[220px] bg-amber-50/20 z-10 min-w-[200px] md:min-w-[280px] max-w-[200px] md:max-w-[280px] align-top md:shadow-[4px_0_10px_-2px_rgba(0,0,0,0.02)]">
                                    <textarea 
                                      value={classNotes[`${activeClass}-${activeMonth}-${actionDay}-materi`] || ''}
                                      onChange={(e) => handleNoteChange('materi', e.target.value)}
                                      className="w-full h-full min-h-[500px] p-3 text-xs bg-transparent outline-none resize-none text-slate-700 placeholder-slate-400 leading-relaxed"
                                      placeholder={`Catatan materi untuk tanggal ${actionDay}...`}
                                    />
                                  </td>
                                )}
                                
                                {daysInMonth.map(day => {
                                  const status = attendanceJurnal[`${activeClass}-${activeMonth}-${student}-${day}`];
                                  
                                  let bgClass = 'bg-transparent md:hover:bg-slate-100 active:bg-slate-200';
                                  let textClass = 'text-slate-300';
                                  
                                  if (status === 'H') { bgClass = 'bg-emerald-50 active:bg-emerald-100'; textClass = 'text-emerald-600 font-bold'; }
                                  else if (status === 'I') { bgClass = 'bg-blue-50 active:bg-blue-100'; textClass = 'text-blue-600 font-bold'; }
                                  else if (status === 'S') { bgClass = 'bg-amber-50 active:bg-amber-100'; textClass = 'text-amber-600 font-bold'; }
                                  else if (status === 'A') { bgClass = 'bg-red-50 active:bg-red-100'; textClass = 'text-red-600 font-bold'; }

                                  return (
                                    <td key={day} className="p-0 border-r border-slate-100 z-0 relative">
                                      <button
                                        type="button"
                                        onClick={() => toggleAttendance(student, day, true)} 
                                        className={`w-full h-10 sm:h-8 flex items-center justify-center text-xs transition-colors cursor-pointer select-none touch-manipulation ${bgClass} ${textClass}`}
                                      >
                                        {status || '·'}
                                      </button>
                                    </td>
                                  );
                                })}
                                <td className="py-1 px-1 text-center font-bold text-emerald-600 bg-emerald-50/30">{rekap.H || '-'}</td>
                                <td className="py-1 px-1 text-center font-bold text-blue-600 bg-blue-50/30">{rekap.I || '-'}</td>
                                <td className="py-1 px-1 text-center font-bold text-amber-600 bg-amber-50/30">{rekap.S || '-'}</td>
                                <td className="py-1 px-1 text-center font-bold text-red-600 bg-red-50/30">{rekap.A || '-'}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                    
                    <div className="bg-white p-3 border-t border-slate-200 text-[11px] text-slate-500 flex flex-wrap justify-center sm:justify-start items-center gap-4">
                      <div className="flex gap-4 font-semibold uppercase tracking-wider">
                        <span className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 bg-emerald-400 rounded-xs"></div> Hadir</span>
                        <span className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 bg-blue-400 rounded-xs"></div> Izin</span>
                        <span className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 bg-amber-400 rounded-xs"></div> Sakit</span>
                        <span className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 bg-red-500 rounded-xs"></div> Alpha</span>
                      </div>
                    </div>
                  </div>
                )}

                {/* TAB: JADWAL PELAJARAN */}
                {activeTab === 'jadwal' && (
                  <div className="space-y-4">
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col justify-between items-start gap-4">
                        <div className="w-full flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
                                <h2 className="text-sm font-bold text-slate-800">📅 Jadwal Pelajaran</h2>
                                <p className="text-xs text-slate-500 mt-0.5">
                                    Semester Ganjil Tahun Ajaran 2026/2027
                                </p>
                            </div>
                            <div className="flex bg-slate-100 p-1 rounded-lg border border-slate-200 self-stretch sm:self-auto">
                                <button
                                    onClick={() => setViewJadwalMode('kelas')}
                                    className={`flex-1 sm:flex-none px-4 py-1.5 text-xs font-bold rounded-md transition-colors ${viewJadwalMode === 'kelas' ? 'bg-white shadow-sm text-emerald-700' : 'text-slate-500 hover:text-slate-700'}`}
                                >
                                    Jadwal Kelas
                                </button>
                                <button
                                    onClick={() => setViewJadwalMode('guru')}
                                    className={`flex-1 sm:flex-none px-4 py-1.5 text-xs font-bold rounded-md transition-colors ${viewJadwalMode === 'guru' ? 'bg-white shadow-sm text-emerald-700' : 'text-slate-500 hover:text-slate-700'}`}
                                >
                                    Jadwal Mengajar (Guru)
                                </button>
                            </div>
                        </div>

                        {viewJadwalMode === 'kelas' && (
                            <div className="w-full pt-3 border-t border-slate-100 flex flex-col gap-3">
                                <span className="text-xs font-bold text-slate-700">Tampilkan Kelas:</span>
                                
                                <div className="flex flex-col gap-2 w-full">
                                    <div className="flex flex-wrap gap-1.5">
                                        <span className="text-[10px] font-bold text-emerald-800 bg-emerald-50 px-2 py-1.5 rounded border border-emerald-200 w-12 text-center">KL 7</span>
                                        {['7A', '7B', '7C', '7D', '7E', '7F', '7G', '7H'].map(cls => (
                                            <button 
                                                key={cls} onClick={() => setSelectedJadwalClass(cls)}
                                                className={`px-3 py-1 text-xs font-bold rounded-md border transition-all ${selectedJadwalClass === cls ? 'bg-emerald-600 text-white border-emerald-700 shadow-sm scale-105' : 'bg-white text-slate-600 border-slate-200 hover:border-emerald-400'}`}
                                            >
                                                Kelas {cls}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex flex-wrap gap-1.5">
                                        <span className="text-[10px] font-bold text-blue-800 bg-blue-50 px-2 py-1.5 rounded border border-blue-200 w-12 text-center">KL 8</span>
                                        {['8A', '8B', '8C', '8D', '8E', '8F', '8G', '8H', '8I', '8J'].map(cls => (
                                            <button 
                                                key={cls} onClick={() => setSelectedJadwalClass(cls)}
                                                className={`px-3 py-1 text-xs font-bold rounded-md border transition-all ${selectedJadwalClass === cls ? 'bg-blue-600 text-white border-blue-700 shadow-sm scale-105' : 'bg-white text-slate-600 border-slate-200 hover:border-blue-400'}`}
                                            >
                                                Kelas {cls}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex flex-wrap gap-1.5">
                                        <span className="text-[10px] font-bold text-purple-800 bg-purple-50 px-2 py-1.5 rounded border border-purple-200 w-12 text-center">KL 9</span>
                                        {['9A', '9B', '9C', '9D', '9E', '9F', '9G', '9H', '9I', '9J', '9K'].map(cls => (
                                            <button 
                                                key={cls} onClick={() => setSelectedJadwalClass(cls)}
                                                className={`px-3 py-1 text-xs font-bold rounded-md border transition-all ${selectedJadwalClass === cls ? 'bg-purple-600 text-white border-purple-700 shadow-sm scale-105' : 'bg-white text-slate-600 border-slate-200 hover:border-purple-400'}`}
                                            >
                                                Kelas {cls}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {viewJadwalMode === 'guru' && (
                            <div className="w-full pt-3 border-t border-slate-100 flex flex-wrap items-center gap-3">
                                <span className="text-xs font-bold text-slate-700">Jadwal Untuk:</span>
                                <span className="text-sm font-black text-emerald-700 bg-emerald-50 px-3 py-1 rounded border border-emerald-200">{loggedInUser || 'Belum Login'}</span>
                            </div>
                        )}
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                      {(viewJadwalMode === 'kelas' ? currentClassSchedule : currentTeacherSchedule).map((dayData, idx) => (
                        <div key={idx} className="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden flex flex-col h-full">
                          <div className={`border-b px-4 py-2.5 flex justify-between items-center ${viewJadwalMode === 'kelas' ? 'bg-emerald-50 border-emerald-100' : 'bg-slate-50 border-slate-200'}`}>
                              <h2 className={`text-sm font-black uppercase tracking-widest ${viewJadwalMode === 'kelas' ? 'text-emerald-800' : 'text-slate-700'}`}>{dayData.day}</h2>
                              {(() => {
                                  // Menghitung total jam mengajar di hari tersebut
                                  const totalJam = dayData.rows.filter(r => (viewJadwalMode === 'kelas' ? (r.mapel && r.mapel !== '' && r.mapel !== '-') : (r.kelas && r.kelas !== '' && r.kelas !== '-'))).length;
                                  return totalJam > 0 ? (
                                      <span className="text-[10px] font-bold bg-white text-emerald-700 px-2 py-0.5 rounded-full border border-emerald-200 shadow-sm">
                                          {totalJam} Jam
                                      </span>
                                  ) : null;
                              })()}
                          </div>
                          <div className="p-0 flex-1">
                            <table className="w-full text-xs text-left">
                                <thead className="bg-white text-slate-400">
                                    <tr>
                                        <th className="border-b border-slate-100 py-2 px-3 font-semibold w-10 text-center">Jam</th>
                                        <th className="border-b border-slate-100 py-2 px-2 font-semibold w-24 text-center">Waktu</th>
                                        {viewJadwalMode === 'guru' && <th className="border-b border-slate-100 py-2 px-2 font-semibold w-16 text-center">Kelas</th>}
                                        <th className="border-b border-slate-100 py-2 px-3 font-semibold">Mata Pelajaran {viewJadwalMode === 'kelas' ? '& Guru' : ''}</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {dayData.rows.map((row, rIdx) => {
                                        const isBreak = ['Break', 'MBG', 'Dhuhur', 'Pembiasaan', 'Literasi', 'Upc'].includes(row.jam);
                                        const hasData = viewJadwalMode === 'kelas' ? (row.mapel && row.mapel !== '-') : (row.kelas && row.kelas !== '-' && row.kelas !== '');
                                        
                                        return (
                                          <tr key={rIdx} className={`border-b border-slate-50 last:border-b-0 ${isBreak ? 'bg-slate-50/80 text-slate-500 italic' : (hasData ? (viewJadwalMode === 'kelas' ? 'bg-emerald-50/30 hover:bg-emerald-50 text-slate-800' : 'bg-blue-50/30 hover:bg-blue-50 text-slate-800') : 'text-slate-400')}`}>
                                              <td className="py-2 px-3 font-medium text-center">{row.jam}</td>
                                              <td className="py-2 px-2 text-center tracking-wider text-[10px]">{row.waktu}</td>
                                              
                                              {viewJadwalMode === 'guru' && (
                                                <td className="py-2 px-2 font-bold text-blue-600 text-center">{row.kelas === '-' ? '' : row.kelas}</td>
                                              )}
                                              
                                              <td className="py-2 px-3">
                                                  {viewJadwalMode === 'kelas' ? (
                                                      <div className="flex flex-col">
                                                          <span className={`font-bold ${hasData ? 'text-slate-800' : 'text-slate-300'}`}>{row.mapel === '-' ? '' : row.mapel}</span>
                                                          {hasData && <span className="text-[10px] text-emerald-600 font-medium">{row.guru}</span>}
                                                      </div>
                                                  ) : (
                                                      <span className={`font-medium ${hasData ? 'text-slate-800' : 'text-slate-300'}`}>{row.mapel === '-' ? '' : row.mapel}</span>
                                                  )}
                                              </td>
                                          </tr>
                                        )
                                    })}
                                </tbody>
                            </table>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* TAB: TABUNGAN */}
                {activeTab === 'tabungan' && (
                   <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col relative z-0">
                      <div className="bg-amber-50/50 border-b border-amber-100 p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                          <div>
                              <h2 className="text-sm font-bold text-amber-800 flex items-center gap-2">
                                  💳 Pencatatan Tabungan Siswa - Kelas {activeClass} ({activeMonth})
                              </h2>
                              <p className="text-xs text-amber-600 mt-1">Gunakan tabel ini untuk mencatat tabungan. Pilih tanggal di sebelah kanan untuk input harian.</p>
                          </div>
                          <div className="flex flex-wrap items-center gap-3 w-full sm:w-auto relative z-10">
                              <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg border border-amber-200 shadow-xs flex-1 sm:flex-none justify-center">
                                  <span className="text-xs font-bold text-amber-800">Tgl Nabung:</span>
                                  <select
                                      value={actionDay}
                                      onChange={(e) => setActionDay(parseInt(e.target.value))}
                                      className="bg-transparent text-sm font-bold text-amber-900 focus:outline-none cursor-pointer"
                                  >
                                      {daysInMonth.map(d => <option key={d} value={d}>{d}</option>)}
                                  </select>
                              </div>
                              <button
                                  type="button"
                                  disabled={isSyncing}
                                  onClick={handleSyncSavings}
                                  className={`px-4 py-2 font-bold rounded-lg text-xs shadow-xs transition-all touch-manipulation whitespace-nowrap flex-1 sm:flex-none ${isSyncing ? 'bg-emerald-400 text-white cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 text-white'}`}
                              >
                                  {isSyncing ? 'Mengirim...' : 'Kirim Data'}
                              </button>
                          </div>
                      </div>
                      <div className="overflow-x-auto custom-scrollbar" style={{ maxHeight: '60vh' }}>
                          <table className="w-full text-sm text-left relative z-0 border-collapse">
                              <thead className="sticky top-0 z-20 shadow-xs">
                                  <tr>
                                      <th className="py-3 px-4 font-bold border-b border-slate-200 w-12 text-center bg-[#7DA3A1] text-slate-900">No.</th>
                                      <th className="py-3 px-4 font-bold border-b border-slate-200 min-w-[200px] bg-[#7DA3A1] text-slate-900">Nama Siswa</th>
                                      <th className="py-3 px-4 font-bold border-b border-slate-200 bg-slate-50 text-slate-700 min-w-[180px]">Nominal Tabungan (Tgl {actionDay})</th>
                                      <th className="py-3 px-4 font-bold border-b border-slate-200 bg-amber-100 text-amber-900 min-w-[160px] text-right">Total Bulanan</th>
                                  </tr>
                              </thead>
                              <tbody>
                                  {currentStudents.map((student, idx) => {
                                      const key = `${activeClass}-${activeMonth}-${student}-${actionDay}`;
                                      const studentTotal = getStudentTotalSavings(student);
                                      const safeTabRowId = `tab-row-${sanitizeId(student)}`;
                                      return (
                                          <tr id={safeTabRowId} key={idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors duration-300">
                                              <td className="py-2 px-4 text-center font-bold text-slate-800 bg-white">{idx + 1}</td>
                                              <td className="py-2 px-4 font-bold text-slate-900 bg-white">{student}</td>
                                              <td className="py-2 px-4">
                                                  <div className="flex items-center gap-2 max-w-[200px]">
                                                      <span className="text-slate-400 text-xs font-bold">Rp</span>
                                                      <input 
                                                          type="number"
                                                          placeholder="0"
                                                          value={savingsData[key] || ''}
                                                          onChange={(e) => handleSavingChange(student, e.target.value)}
                                                          className="w-full px-3 py-1.5 border border-slate-200 rounded-md bg-white text-slate-700 font-semibold focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500"
                                                      />
                                                  </div>
                                              </td>
                                              <td className="py-2 px-4 text-right font-bold text-emerald-700 bg-amber-50/30">
                                                  Rp {studentTotal.toLocaleString('id-ID')}
                                              </td>
                                          </tr>
                                      );
                                  })}
                                  {currentStudents.length === 0 && (
                                      <tr><td colSpan="4" className="py-8 text-center text-slate-400">Pilih kelas terlebih dahulu atau Tambah Siswa Baru</td></tr>
                                  )}
                              </tbody>
                              {currentStudents.length > 0 && (
                                <tfoot className="bg-slate-100 font-bold border-t-2 border-slate-300 relative z-10">
                                  <tr>
                                    <td colSpan="2" className="py-3 px-4 text-slate-800 text-right">TOTAL HARIAN (TGL {actionDay}):</td>
                                    <td className="py-3 px-4 text-emerald-800 font-extrabold text-base">
                                      Rp {getDailyTotalSavings(actionDay).toLocaleString('id-ID')}
                                    </td>
                                    <td className="py-3 px-4 text-right text-emerald-900 font-black text-base bg-amber-200/50">
                                      Rp {currentStudents.reduce((acc, st) => acc + getStudentTotalSavings(st), 0).toLocaleString('id-ID')}
                                    </td>
                                  </tr>
                                </tfoot>
                              )}
                          </table>
                      </div>
                   </div>
                )}

              </div>
            </div>
          );
        }

        const root = window.ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
